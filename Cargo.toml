[package]
# `slog` is taken on crates.io; the installed command is still `slog` (see [[bin]]).
name = "slog-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Console.app for the command line: read macOS and iOS unified logs, and crash reports, from stdout"
license = "MIT"
readme = "README.md"
repository = "https://github.com/bratsche/slog"
keywords = ["macos", "ios", "logging", "console", "oslog"]
categories = ["command-line-utilities", "development-tools::debugging"]
# Repo-only files. Keep skill/: src/skill.rs include_str!s skill/SKILL.md.
exclude = [".github", "docs"]

[[bin]]
name = "slog"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-stream = "0.3"
chrono = "0.4"
clap = { version = "4", features = ["derive", "wrap_help"] }
futures = "0.3"
idevice = { version = "0.1.68", features = ["usbmuxd", "syslog_relay", "crashreportcopymobile"] }
libc = "0.2"
plist = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "signal", "sync"] }
